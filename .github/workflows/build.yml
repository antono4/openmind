name: Build & Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number'
        required: false
        default: '1.0.0'

jobs:
  build-cli:
    name: Build CLI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build CLI
        run: pnpm --filter @openmind/cli build

      - name: Build API Server
        run: pnpm --filter @openmind/api-server build

      - name: Create distribution
        run: |
          mkdir -p dist/installers
          cp -r apps/cli/dist/* dist/installers/ 2>/dev/null || true
          cp -r apps/api-server/dist/* dist/installers/ 2>/dev/null || true
          cp scripts/install/install-linux.sh dist/installers/ 2>/dev/null || true
          cp scripts/install/install-windows.ps1 dist/installers/ 2>/dev/null || true
          
          cat > dist/installers/README.txt << 'EOF'
OPEN MIND AI - Portable Version
===============================

Usage:
  CLI:    node dist/main.js --help
  API:    node dist/index.js

For full installation, see INSTALL.md

For AI features, install Ollama:
  curl -fsSL https://ollama.ai/install.sh | sh
  ollama pull llama3

More info: https://github.com/Antono4/openmind
EOF

      - name: Create ZIP
        run: |
          cd dist/installers
          zip -r ../OPEN-MIND-AI-portable.zip .
          cd ../..

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: openmind-cli
          path: |
            dist/OPEN-MIND-AI-portable.zip
            dist/installers/*

  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build-cli
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: openmind-cli
          path: dist/installers

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.event.inputs.version || '1.0.0' }}
          release_name: OPEN MIND AI v${{ github.event.inputs.version || '1.0.0' }}
          body: |
            ## Downloads

            ### Windows / Linux / macOS
            - Portable ZIP: `OPEN-MIND-AI-portable.zip`

            ## Installation

            1. Download the ZIP file
            2. Extract to desired location
            3. Run `openmind --help` to start

            ## Features

            - Open-source AI without token limitations
            - Local LLM support via Ollama
            - Vector search capabilities
            - File processing (PDF, DOCX, images)
            - Plugin system for extensibility
            - REST API and WebSocket support
          files: dist/installers/*
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}