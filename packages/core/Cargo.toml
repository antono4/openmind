[package]
name = "openmind-core"
version = "1.0.0"
edition = "2021"
description = "OPEN MIND AI - Core Rust library with memory and token management"
authors = ["OPEN MIND Team"]

[lib]
name = "openmind_core"
crate-type = ["lib", "cdylib", "rlib"]

[dependencies]
tokio = { version = "1.36", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.31", features = ["bundled"] }
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.7", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
once_cell = "1.19"
dashmap = "5.5"
parking_lot = "0.12"

[dev-dependencies]
tempfile = "3.10"
criterion = "0.5"

[[bench]]
name = "benchmarks"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1